[project]
name = "fliberator"
version = "0.1.0"
description = "Liberate downloadable Florida statutes from a proprietary format."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ansel Halliburton" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
fliberate = "fliberator.cli:main"

[project.urls]
Homepage = "https://github.com/anseljh/FLiberator"
Repository = "https://github.com/anseljh/FLiberator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fliberator"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
